version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dev:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/fms_ui/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend:
        patterns:
          - "*"
