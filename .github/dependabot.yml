version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dev:
        patterns:
          - "*"
    ignore:
      # mypy 2.x drops Python 3.9; lift this together with the 0.2 baseline.
      - dependency-name: "mypy"
        versions:
          - ">=2"

  - package-ecosystem: "npm"
    directory: "/fms_ui/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend:
        patterns:
          - "*"
    ignore:
      # vue-tsc 3.x cannot run under TypeScript 7 (resolveTscPath crash), and
      # TypeScript 6 hard-errors on tsconfig baseUrl (TS5101) before that
      # option is migrated. Lift this together: migrate baseUrl, then raise
      # the floor once vue-tsc ships TS 7 support.
      - dependency-name: "typescript"
        versions:
          - ">=6"
