name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check site links resolve
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          page = Path("site/index.html").read_text(encoding="utf-8")
          # Only relative links break on Pages; absolute raw.githubusercontent URLs are fine.
          for probe in ("../docs", 'href="docs', 'src="docs', "lorem", "TODO"):
              assert probe not in page, probe
          print("site link check ok")
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
