name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(python -c "import sys; sys.path.insert(0, 'core'); from fms_lib import __version__; print(__version__)")"
          echo "tag: ${TAG_VERSION}, package: ${PACKAGE_VERSION}"
          test "${TAG_VERSION}" = "${PACKAGE_VERSION}"

      - name: Compile
        run: python -m compileall -q core fms_ui skills/find-my-session/scripts tools tests

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fms_ui/frontend/package-lock.json

      - name: Build frontend
        working-directory: fms_ui/frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Check built assets match the tag
        run: |
          if [ -n "$(git status --porcelain -- fms_ui/static)" ]; then
            echo "fms_ui/static is out of date at this tag:"
            git status --porcelain -- fms_ui/static
            exit 1
          fi

      - name: Build standalone artifacts
        run: python tools/build_artifacts.py --output dist

      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS.txt

      - name: Smoke test standalone artifacts
        run: |
          dist/find-my-session-skill/scripts/fms --version
          dist/find-my-session-ui/fms-ui --version

      - name: Build Python distributions
        run: |
          python -m pip install build
          python -m build --outdir dist

      - name: Rebuild checksums for every release asset
        run: |
          cd dist
          rm SHA256SUMS.txt
          sha256sum find-my-session-skill.zip find-my-session-ui.zip ./*.whl ./*.tar.gz > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload Python distributions for publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/find-my-session-skill.zip
            dist/find-my-session-ui.zip
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt

      - name: Create or refresh release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/find-my-session-skill.zip \
              dist/find-my-session-ui.zip \
              dist/*.whl \
              dist/*.tar.gz \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Find My Session ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              dist/find-my-session-skill.zip \
              dist/find-my-session-ui.zip \
              dist/*.whl \
              dist/*.tar.gz \
              dist/SHA256SUMS.txt
          fi

  publish-pypi:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/find-my-session
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1
        with:
          skip-existing: true
