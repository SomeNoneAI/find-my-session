name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(python -c "import sys; sys.path.insert(0, 'core'); from fms_lib import __version__; print(__version__)")"
          echo "tag: ${TAG_VERSION}, package: ${PACKAGE_VERSION}"
          test "${TAG_VERSION}" = "${PACKAGE_VERSION}"

      - name: Compile
        run: python -m compileall -q core fms_ui skills/find-my-session/scripts tools tests

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fms_ui/frontend/package-lock.json

      - name: Build frontend
        working-directory: fms_ui/frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Check built assets match the tag
        run: |
          if [ -n "$(git status --porcelain -- fms_ui/static)" ]; then
            echo "fms_ui/static is out of date at this tag:"
            git status --porcelain -- fms_ui/static
            exit 1
          fi

      - name: Build standalone artifacts
        run: python tools/build_artifacts.py --output dist

      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS.txt

      - name: Smoke test standalone artifacts
        run: |
          dist/find-my-session-skill/scripts/fms --version
          dist/find-my-session-ui/fms-ui --version

      - name: Build Python distributions
        run: |
          python -m pip install build
          python -m build --outdir dist

      - name: Rebuild checksums for every release asset
        run: |
          cd dist
          rm SHA256SUMS.txt
          sha256sum find-my-session-skill.zip find-my-session-ui.zip ./*.whl ./*.tar.gz > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload Python distributions for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/find-my-session-skill.zip
            dist/find-my-session-ui.zip
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt

      - name: Create or refresh release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/find-my-session-skill.zip \
              dist/find-my-session-ui.zip \
              dist/*.whl \
              dist/*.tar.gz \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Find My Session ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              dist/find-my-session-skill.zip \
              dist/find-my-session-ui.zip \
              dist/*.whl \
              dist/*.tar.gz \
              dist/SHA256SUMS.txt
          fi

  publish-pypi:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/find-my-session
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1
        with:
          skip-existing: true
