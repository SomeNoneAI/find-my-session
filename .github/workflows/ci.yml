name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  RUFF_VERSION: "0.17.3"
  MYPY_VERSION: "1.20.2"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is not available on the Ubuntu 26.04 runner image.
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install zstd
        if: matrix.python-version == '3.9'
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Compile
        run: python -m compileall -q core fms_ui skills/find-my-session/scripts tools tests

      - name: Test
        run: python -m unittest discover -s tests -v

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: python -m pip install "ruff==${RUFF_VERSION}"

      - name: Lint
        run: ruff check .

  typecheck:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Mypy
        run: python -m pip install "mypy==${MYPY_VERSION}"

      - name: Type-check
        run: mypy

  frontend:
    name: Frontend (Vue 3 + TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fms_ui/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: fms_ui/frontend
        run: npm ci

      - name: Type-check
        working-directory: fms_ui/frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: fms_ui/frontend
        run: npm test

      - name: Build frontend
        working-directory: fms_ui/frontend
        run: npm run build

      - name: Check built assets are committed
        run: |
          if [ -n "$(git status --porcelain -- fms_ui/static)" ]; then
            echo "fms_ui/static is out of date; run npm run build in fms_ui/frontend and commit the result:"
            git status --porcelain -- fms_ui/static
            exit 1
          fi

  build:
    name: Build and smoke-test artifacts
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build artifacts
        run: python tools/build_artifacts.py --output dist

      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS.txt

      - name: Smoke test artifacts
        run: |
          python -m zipfile -l dist/find-my-session-skill.zip
          python -m zipfile -l dist/find-my-session-ui.zip
          test -f dist/find-my-session-skill/LICENSE
          test -f dist/find-my-session-ui/LICENSE
          test -f dist/find-my-session-ui/README.md
          dist/find-my-session-skill/scripts/fms --version
          dist/find-my-session-ui/fms-ui --version

  packaging:
    name: Build Python distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build
        run: python -m pip install build

      - name: Build distributions
        run: python -m build --outdir dist-py

      - name: Verify source distribution
        run: python -m unittest tests.test_release.SdistBuildTests -v

  windows:
    name: Windows / Python 3.13 (experimental)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Compile
        run: python -m compileall -q core fms_ui skills/find-my-session/scripts tools tests

      - name: Test
        run: python -m unittest discover -s tests -v

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install coverage tooling
        run: python -m pip install coverage

      - name: Measure test coverage
        run: PYTHONPATH=core:. python -m coverage run --source=fms_lib,fms_ui -m unittest discover -s tests

      - name: Report coverage
        run: python -m coverage report --show-missing --fail-under=80
