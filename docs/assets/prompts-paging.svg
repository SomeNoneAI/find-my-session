<svg xmlns="http://www.w3.org/2000/svg" width="980" height="704" viewBox="0 0 980 704" role="img" aria-label="fms prompts count and paging in a terminal">
<rect width="980" height="704" rx="14" fill="#0d1117"/>
<rect width="980" height="44" rx="14" fill="#161b22"/>
<rect y="30" width="980" height="14" fill="#161b22"/>
<circle cx="24" cy="22" r="6.5" fill="#ff5f57"/><circle cx="44" cy="22" r="6.5" fill="#febc2e"/><circle cx="64" cy="22" r="6.5" fill="#28c840"/>
<text x="490" y="27" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8b949e">find-my-session — fms prompts paging</text>
<g xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5">
<text x="26" y="74" fill="#7ee787">$</text>
<text x="44" y="74" fill="#e6edf3" font-weight="600">fms prompts kimi-code:e5f6a7b8 --count</text>
<text x="44" y="96" fill="#c9d1d9">5</text>
<text x="26" y="140" fill="#7ee787">$</text>
<text x="44" y="140" fill="#e6edf3" font-weight="600">fms prompts kimi-code:e5f6a7b8 --limit 2</text>
<text x="44" y="162" fill="#7ee787" font-weight="600"># kimi-code:e5f6a7b8 user prompts</text>
<text x="44" y="206" fill="#c9d1d9">total: 5, returned: 2, order: oldest</text>
<text x="44" y="250" fill="#79c0ff" font-weight="600">## 1 · 2026-10-26 17:00</text>
<text x="44" y="272" fill="#c9d1d9">Refactor handoff parser for the CLI</text>
<text x="44" y="316" fill="#79c0ff" font-weight="600">## 2 · 2026-10-26 17:01</text>
<text x="44" y="338" fill="#c9d1d9">Also list every edited file</text>
<text x="44" y="382" fill="#e3b341">next: --offset 2 --limit 2</text>
<text x="26" y="426" fill="#7ee787">$</text>
<text x="44" y="426" fill="#e6edf3" font-weight="600">fms prompts kimi-code:e5f6a7b8 --limit 2 --offset 2</text>
<text x="44" y="448" fill="#7ee787" font-weight="600"># kimi-code:e5f6a7b8 user prompts</text>
<text x="44" y="492" fill="#c9d1d9">total: 5, returned: 2, order: oldest</text>
<text x="44" y="536" fill="#79c0ff" font-weight="600">## 3 · 2026-10-26 17:02</text>
<text x="44" y="558" fill="#c9d1d9">Keep the output under two pages</text>
<text x="44" y="602" fill="#79c0ff" font-weight="600">## 4 · 2026-10-26 17:03</text>
<text x="44" y="624" fill="#c9d1d9">继续</text>
<text x="44" y="668" fill="#e3b341">next: --offset 4 --limit 2</text>
</g>
</svg>
